<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dharshan</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

            body{
                min-height:100vh;
                display:flex;
                align-items:center;
                flex-direction:column;
                background:linear-gradient(135deg,#ff416c,#ff4b2b);
                font-family:Arial, sans-serif;
                text-align:center;
                color:white;
                overflow-y:auto;
            }

        h1{
            font-size:4rem;
            animation:glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                text-shadow:0 0 10px white;
            }
            to{
                text-shadow:0 0 30px yellow,
                            0 0 50px orange;
            }
        }

        button{
            margin-top:30px;
            padding:15px 35px;
            font-size:20px;
            border:none;
            border-radius:30px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.1);
        }

        #message{
            margin-top:30px;
            font-size:24px;
            max-width:700px;
        }

        .balloon{
            position:absolute;
            bottom:-100px;
            font-size:40px;
            animation:float 10s linear infinite;
        }

        @keyframes float{
            from{
                transform:translateY(0);
            }
            to{
                transform:translateY(-120vh);
            }
        }
        img{
            size: small;
            width: 600px;
            height: 300px;
            border-radius: 20px;
        }
    </style>
</head>

    <body>

        <h1>🎉 Happy Birthday Dharshan 🎉</h1>

        <h2>🎂 Have an Amazing Day 🎂</h2>
        <img src = "dharshan.jpeg" > 

        <button onclick="showWish()">🎁 Open Your Surprise</button>

        <div id="message"></div>

        <div class="balloon" style="left:10%; animation-delay:0s;">🎈</div>
        <div class="balloon" style="left:25%; animation-delay:2s;">🎈</div>
        <div class="balloon" style="left:40%; animation-delay:4s;">🎈</div>
        <div class="balloon" style="left:60%; animation-delay:1s;">🎈</div>
        <div class="balloon" style="left:80%; animation-delay:3s;">🎈</div>

        <script>
            function showWish(){

                document.getElementById("message").innerHTML =
                "⏳ Preparing your birthday surprise...";

                setTimeout(() => {

                    document.getElementById("message").innerHTML = `
                    <h2>🎊 Surprise! 🎊</h2>
                    <p>
                    Happy Birthday Dharshan! 🎂🎉<br><br>
                    "Happy Birthday Bro! Have a great day and enjoy every moment. 
                    God has given you another beautiful year of life. 
                    Stay happy and keep smiling!" 🎉🎂🎁✨ 🎂🎉<br><br>

                    </p>
                    `;
                    

                },3000);
            }
        </script>
</body>
</html>
